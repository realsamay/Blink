name: Build & Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Linux .deb Package
  # -------------------------------------------------------------
  build-linux:
    name: Build Linux .deb
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3-opencv python3-numpy python3-cryptography libxss1 libx11-6
          python -m pip install --upgrade pip
          pip install opencv-python-headless pillow

      - name: Build Debian Package (.deb)
        run: |
          chmod +x packaging/linux/build_deb.sh
          ./packaging/linux/build_deb.sh

      - name: Upload Linux .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blink-linux-deb
          path: dist/blink_*_amd64.deb

  # -------------------------------------------------------------
  # Job 2: Build Windows .exe Installer
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows .exe Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Windows dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt
          pip install pyinstaller

      - name: Run Windows Unit Tests
        run: |
          python -m unittest discover tests

      - name: Freeze with PyInstaller
        run: |
          pyinstaller packaging/windows/blink.spec

      - name: Build Inno Setup Installer (.exe)
        shell: cmd
        run: |
          if not exist "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" (
            choco install innosetup --no-progress -y
          )
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\BlinkSetup.iss

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blink-windows-exe
          path: dist/Blink-Setup-x64.exe

  # -------------------------------------------------------------
  # Job 3: Publish to GitHub Releases
  # -------------------------------------------------------------
  release:
    name: Publish Release Assets
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: blink-linux-deb
          path: dist

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: blink-windows-exe
          path: dist

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v2.1.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: "Blink ${{ steps.tag_info.outputs.tag }}"
          draft: false
          prerelease: false
          files: |
            dist/*.deb
            dist/*.exe
          body: |
            ### Blink Biometric Screen Unlock (${{ steps.tag_info.outputs.tag }})
            
            Seamless, Apple-style Face ID for Linux and Windows 10/11 desktops.
            
            #### 📦 Downloads:
            - **🐧 Linux (Debian, Ubuntu, Mint)**: [`blink_2.1.0_amd64.deb`](https://github.com/realsamay/Blink/releases/download/${{ steps.tag_info.outputs.tag }}/blink_2.1.0_amd64.deb)
            - **🪟 Windows (10/11 64-bit)**: [`Blink-Setup-x64.exe`](https://github.com/realsamay/Blink/releases/download/${{ steps.tag_info.outputs.tag }}/Blink-Setup-x64.exe)
            
            #### ✨ Highlights:
            - 100% On-Device & Private (YuNet CNN + ArcFace 512-D MobileFaceNet)
            - Multi-cue anti-spoofing heuristics (glare, bezels, 3D planar homography)
            - 100×100 px obsidian black squircle with 22px hardware rounded corners
            - Sub-25ms keystroke injection on Linux (`/dev/uinput`), sub-5ms on Windows (`SendInput`)
            - Focus-safe Windows architecture (`WS_EX_NOACTIVATE`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
